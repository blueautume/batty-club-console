# This file is loaded inside nginx's http context. It only adds lihao.wiki.
limit_req_zone $binary_remote_addr zone=batty_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lihao.wiki www.lihao.wiki;
    return 308 https://lihao.wiki$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lihao.wiki;
    ssl_certificate /etc/nginx/tls/lihao.wiki/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/lihao.wiki/privkey.pem;
    return 308 https://lihao.wiki$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lihao.wiki;
    ssl_certificate /etc/nginx/tls/lihao.wiki/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/lihao.wiki/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/batty-club.access.log;
    error_log /var/log/nginx/batty-club.error.log;
    client_max_body_size 2m;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Host lihao.wiki;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/login {
        limit_req zone=batty_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4318;
    }

    location / {
        proxy_pass http://127.0.0.1:4318;
    }
}

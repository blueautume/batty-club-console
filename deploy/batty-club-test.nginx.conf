# Load inside Nginx's http context for test.lihao.wiki.
limit_req_zone $binary_remote_addr zone=batty_test_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name test.lihao.wiki;

    access_log /var/log/nginx/batty-club-test.access.log;
    error_log /var/log/nginx/batty-club-test.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/batty-club-test-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://test.lihao.wiki$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.lihao.wiki;
    ssl_certificate /etc/batty-club-test/acme/certificates/test.lihao.wiki.crt;
    ssl_certificate_key /etc/batty-club-test/acme/certificates/test.lihao.wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/batty-club-test.access.log;
    error_log /var/log/nginx/batty-club-test.error.log;
    client_max_body_size 2m;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Host test.lihao.wiki;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/login {
        limit_req zone=batty_test_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4319;
    }

    location / {
        proxy_pass http://127.0.0.1:4319;
    }
}
